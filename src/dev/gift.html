<!-- Dev page (not shipped): renders 星空贺卡 mockups through the real PosterStudio. -->
<script type="module">
import { PosterStudio } from '../js/poster.js';
import { loadCatalog } from '../js/catalog.js';
import { poemForPerson } from '../js/poems.js';
import { T } from '../js/copy.js';
const catalog = await loadCatalog('/data/', '');
await catalog.deepReady;
const studio = new PosterStudio(catalog);
const city = (name, region, lat, lon, tz) => ({ name, region, lat, lon, tz });
window.FRIEND = { name: '小红', date: '2000-05-20', time: '23:10', unknownTime: false, city: city('成都', '四川', 30.66, 104.07, 'Asia/Shanghai') };
window.renderGift = async (cfg) => {
  const friend = cfg.friend || window.FRIEND;
  const message = cfg.message === 'poem' ? poemForPerson(friend, cfg.step || 0).poem : cfg.message;
  const res = await studio.render({ format: 'card', style: cfg.style || 'night', person: friend, subjectName: friend.name,
    gift: { to: friend.name, from: '小明', greeting: cfg.greeting ?? T.gift.greetingDefault, message }, screenCSSW: 390 });
  return res.dataUrl;
};
window.giftReady = true;
</script>

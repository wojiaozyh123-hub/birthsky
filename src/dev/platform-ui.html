<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ui · dev</title>
<link rel="icon" href="data:,">
<!-- Dev page (not shipped): ui.js toast / hint / press and monetize.js rows, driven by tools/dev/platform-ui.mjs.
     The CSS here is a stand-in for the shell's main.css, following spec §2 tokens and the ui.js DOM contract. -->
<style>
  :root { --text: #EFE8DA; --night: #030407; --plate: rgba(6,7,10,.94); --hair: rgba(239,232,218,.18);
    --f-text: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    --shadow: 0 1px 2px rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.45); }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); font-family: var(--f-text); }
  body { background: radial-gradient(120% 70% at 50% 0%, #0B1015, #03050A 70%), var(--night); overflow: hidden; }
  .nw { white-space: nowrap; }
  #stage { position: fixed; inset: 0; pointer-events: none; }
  #hint-slot, #summary { position: absolute; left: 28px; right: 28px; bottom: calc(34px + 82px); margin: 0; text-align: center;
    font-size: 12px; line-height: 18px; letter-spacing: .04em; text-shadow: var(--shadow); }
  #hint-slot { color: rgba(239,232,218,.62); }
  #summary { color: rgba(239,232,218,.46); transition: opacity 320ms cubic-bezier(0.22,1,0.36,1); }
  #stage.has-hint #summary { opacity: 0; }
  #meta { position: absolute; left: 0; right: 0; bottom: calc(34px + 60px); margin: 0; text-align: center; font-size: 12px; line-height: 18px; letter-spacing: .04em; color: rgba(239,232,218,.62); text-shadow: var(--shadow); }
  /* centred with a transform on purpose: ui.js must only animate its inner span */
  .toast { position: fixed; left: 50%; top: 42%; width: calc(100% - 56px); transform: translate(-50%, -50%); z-index: 30; margin: 0; text-align: center;
    font-size: 13px; line-height: 18px; letter-spacing: .02em; color: rgba(239,232,218,.90); text-shadow: var(--shadow); pointer-events: none; }
  #actions { position: absolute; left: 0; right: 0; bottom: calc(34px + 8px); height: 44px; display: flex; justify-content: center; gap: 28px; pointer-events: auto; }
  #actions button { font: inherit; font-size: 14px; line-height: 20px; letter-spacing: .04em; color: rgba(239,232,218,.80); background: none; border: 0; padding: 12px 0; }
  .plate { position: fixed; left: 0; right: 0; top: 90px; padding: 20px 24px; background: var(--plate); }
  .plate::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--hair); transform: scaleY(.5); }
  .plate h3 { margin: 0 0 8px; font-weight: 400; font-size: 19px; line-height: 28px; color: rgba(239,232,218,.92); }
  .row { display: grid; grid-template-columns: 56px 1fr; padding: 18px 0; font-size: 15px; line-height: 26px; color: rgba(239,232,218,.88); }
  .row span { font-size: 12px; color: rgba(239,232,218,.46); }
  #keep-slot { margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="plate">
    <h3>那一夜</h3>
    <div class="row"><span>节气</span>小暑后的第 8 天。</div>
    <div id="night-slot"></div>
    <div id="keep-slot"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div id="stage">
    <p id="hint-slot"></p>
    <p id="summary">亏凸月 · 农历闰五月廿一 · 小暑 · 4,267 颗星</p>
    <p id="meta">1998 年 7 月 14 日 22:00 · 杭州</p>
    <nav id="actions"><button id="a-listen">聆听</button><button id="a-keep">留存</button><button id="a-pair">两个人</button><button id="a-share">分享</button></nav>
  </div>
<script type="module">
  import * as ui from '../js/ui.js';
  import * as mon from '../js/monetize.js';
  import { CONFIG } from '../js/config.js';
  window.ui = ui; window.mon = mon; window.CONFIG = CONFIG;
  window.__ready = true;
</script>
</body>
</html>

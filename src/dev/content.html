<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>content dev</title>
<script type="importmap">{"imports":{"astronomy-engine":"/node_modules/astronomy-engine/esm/astronomy.js","qrcode-generator":"/node_modules/qrcode-generator/dist/qrcode.mjs"}}</script>
<style>
  :root { --text: #EFE8DA; --f-text: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  html, body { margin: 0; background: #030407; color: var(--text); font-family: var(--f-text); }
  body { padding: 16px 20px 40px; }
  .nw { white-space: nowrap; }
  .cap { font-size: 15px; line-height: 26px; letter-spacing: .02em; opacity: .92; line-break: strict; text-wrap: pretty;
    text-align: center; margin: 0 auto 14px; outline: 1px dashed rgba(239,232,218,.12); }
  .w300 { max-width: 300px; } .w286 { max-width: 286px; } .w220 { max-width: 220px; }
  h6 { font: 400 10px/14px var(--f-text); opacity: .4; margin: 18px 0 6px; letter-spacing: .04em; }
  canvas { display: block; width: 100%; border: 1px dashed rgba(239,232,218,.12); }
  #share-guide { position: fixed; top: 0; right: 0; width: 260px; height: 190px; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 60% at 100% 0%, rgba(3,4,7,.82), rgba(3,4,7,0) 70%); }
  #share-guide.is-active { opacity: 1; }
  #share-guide p { position: absolute; right: 24px; margin: 0; text-align: right; }
  #share-guide-l1 { top: 128px; font-size: 15px; opacity: .95; }
  #share-guide-l2 { top: 152px; font-size: 13px; opacity: .70; }
  #err { color: #E3A08C; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="out"></div>
<h6>wrapCanvas · 便签 L3 · 30px/46 · max 700 · ≤2 lines (1080-wide card at 1/3 scale)</h6>
<canvas id="cv" width="1080" height="420"></canvas>
<div id="share-guide" aria-hidden="true"><p id="share-guide-text">点击右上角 <b>···</b></p></div>
<pre id="err"></pre>
<script type="module">
  const out = document.getElementById('out');
  const err = (e) => { document.getElementById('err').textContent += String(e && e.stack || e) + '\n'; window.__err = true; };
  window.addEventListener('error', (e) => err(e.error || e.message));
  try {
    const copy = await import('../js/copy.js');
    const astro = await import('../js/astro.js');
    const facts = await import('../js/facts.js');
    const share = await import('../js/share.js');
    const { loadCatalog } = await import('../js/catalog.js');
    const { T, noWidow, wrapCanvas } = copy;
    const catalog = await loadCatalog('../data/');
    const P = (name, date, time, city) => ({ name, date, time, unknownTime: false, city });
    const HZ = { name: '杭州', region: '浙江', lat: 30.29, lon: 120.16, tz: 'Asia/Shanghai' };
    const me = P('小明', '1998-07-14', '22:00', HZ);
    const [y, m, d] = me.date.split('-').map(Number);
    const t = astro.zonedToUtc(y, m, d, 22, 0, HZ.tz);
    const sky = astro.skyState(t, HZ.lat, HZ.lon);
    const f = facts.computeFacts(catalog, me, t, sky, new Date('2026-09-30T12:00:00+08:00'));
    const hero = facts.chooseHero(catalog, sky, f);
    const tour = facts.buildTour(catalog, f, sky, hero, '你');

    const add = (label, text, cls) => {
      const h = document.createElement('h6'); h.textContent = label; out.append(h);
      const p = document.createElement('p'); p.className = `cap ${cls}`; p.innerHTML = noWidow(text); out.append(p);
    };
    add('intro lede · 280', T.intro.lede, 'w286');
    add(`hero (${hero.kind}) · caption 300`, hero.caption, 'w300');
    for (const it of tour.slice(1, 4)) add(`tour ${it.key} · 286`, it.text, 'w286');
    add('light-year · 220 (narrow stress)', facts.lightStarSentence(f, '你'), 'w220');
    add('S2 link lede', T.link.person(me), 'w286');
    add('S17 line', T.pair.vegaAltairSplit('小明', '小红'), 'w300');

    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    ctx.fillStyle = '#030407'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.font = `400 30px ${getComputedStyle(document.documentElement).getPropertyValue('--f-text')}`;
    ctx.fillStyle = 'rgba(239,232,218,.9)';
    const lines = wrapCanvas(ctx, facts.lightStarSentence(f, '你'), 700, 2);
    lines.forEach((l, i) => ctx.fillText(l, 80, 60 + i * 46));
    const lines2 = wrapCanvas(ctx, T.pair.vegaAltairSplit('小明', '小红'), 700, 2);
    lines2.forEach((l, i) => ctx.fillText(l, 80, 190 + i * 46));
    const lines3 = wrapCanvas(ctx, '今晚的织女星，光出发于 2001 年。', 300, 3);
    lines3.forEach((l, i) => ctx.fillText(l, 80, 300 + i * 46));
    ctx.strokeStyle = 'rgba(231,211,175,.5)'; ctx.strokeRect(80, 20, 700, 110); ctx.strokeRect(80, 150, 700, 110); ctx.strokeRect(80, 270, 300, 140);
    window.__wrap = { lines, lines2, lines3, widths: [...lines, ...lines2].map((l) => ctx.measureText(l).width), widths3: lines3.map((l) => ctx.measureText(l).width) };

    share.showWeChatGuide(T.share.guide('own'));
    window.__guide = [...document.querySelectorAll('#share-guide p')].map((p) => p.textContent);
    window.__nw = [...document.querySelectorAll('.cap')].map((p) => {
      // no line may consist only of the nowrap tail's first part: measure line boxes of each caption
      const r = document.createRange(); r.selectNodeContents(p);
      const rects = [...r.getClientRects()]; const tops = [...new Set(rects.map((x) => Math.round(x.top)))];
      const nws = [...p.querySelectorAll('.nw')].map((s) => s.getClientRects().length);
      return { lines: tops.length, nwFragments: nws, overflow: p.scrollWidth > p.clientWidth + 1 };
    });
    window.__ok = true;
  } catch (e) { err(e); }
</script>
</body>
</html>
